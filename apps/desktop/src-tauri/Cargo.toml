[package]
name = "forge-desktop"
version = "0.1.0"
description = "FORGE — agentic engineering operating system"
authors = ["FORGE"]
edition = "2024"

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
regex = "1"
dunce = "1"
globset = "0.4"
sha2 = "0.10"
similar = "2"
which = "8"
# Code intelligence (codeintel.rs): parsing only, nothing is executed; the grammar crates compile C via `cc`.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
