# Tests on every push and pull request, on Linux and on a GitHub-hosted Windows runner.
#
# Never runs anything that needs a provider login or spends quota: live tests are #[ignore]d in Rust and are never
# selected here (no --ignored / --include-ignored), and no step has access to Claude or Codex credentials.
name: CI

on:
  push:
    branches: [main, 'cloud/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev

      - name: Install
        run: npm ci

      - name: Engine build, typecheck and tests
        run: |
          npm run build -w @forge/engine
          npm run typecheck -w @forge/engine
          npm run test -w @forge/engine

      - name: UI typecheck and tests
        run: |
          npm run typecheck -w forge-desktop
          npm run test -w forge-desktop

      - name: Git identity for test repositories
        run: |
          git config --global user.name "FORGE CI"
          git config --global user.email "ci@forge.invalid"

      - name: Rust core tests (live tests stay ignored)
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
